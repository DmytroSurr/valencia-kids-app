<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Valencià ↔ Українська • Тренажер для дітей</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</head>
<body>
  <div class="app">
    <h1>Valencià ↔ Українська • Тренажер</h1>
    <div class="top-row">
      <div class="mode-switch">
        <button id="mode-va-uk" class="active">Valencià → Укр</button>
        <button id="mode-uk-va">Укр → Valencià</button>
      </div>
      <div class="top-info">
        <div class="xp-pill">⚡ <span id="xp-value">0</span> XP</div>
        <div class="streak-pill">🔥 <span id="streak-days">0</span> дн.</div>
      </div>
    </div>
    <div class="layout">
      <div class="course-panel">
        <div class="course-title">Курс (Теми)</div>
        <div id="topics-list"></div>
        <div class="small-info">Обирайте тему для тренування. Складні слова можна повторити окремо.</div>
      </div>
      <div>
        <div id="lesson-area">
          <div class="card">
            <div class="card-main">
              <div class="question-label" id="question-label"></div>
              <div class="question-text" id="question-text">—</div>
              <div class="phonetic" id="phonetic"></div>
              <div class="options" id="options"></div>
              <div class="feedback" id="feedback"></div>
              <div class="controls">
                <button class="btn-action" id="speak-btn">🔊 Озвучити</button>
                <button class="btn-action" id="next-btn">Наступне ➔</button>
                <span class="pill" id="topic-pill">Тема: —</span>
              </div>
            </div>
            <div class="image-box" id="image-box">
              <span>Зображення картки</span>
            </div>
          </div>
          <div class="progress-bar-wrapper">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <div class="progress-info">
            <span id="score">Результат: 0 / 0</span>
            <span id="streak">Питання 1 / 10</span>
          </div>
          <div class="actions-row">
            <button class="btn-action" id="weak-btn">🔄 Повторити складні слова теми</button>
          </div>
        </div>
        <div id="lesson-end" style="display:none;">
          <div class="lesson-end">
            <h2>Урок завершено! 🎉</h2>
            <p id="end-summary"></p>
            <div id="end-extra"></div>
            <div class="badge" id="end-badge">⭐ Чудова робота!</div>
            <div class="actions-row" style="margin-top: 20px;">
              <button class="btn-action" id="restart-btn">🔄 Пройти ще раз</button>
              <button class="btn-action" id="next-topic-btn" style="display:none; background: #2563eb;">➡️ Наступна тема</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
